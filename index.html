<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P3KBooks-Landing</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f0eb;font-family:Georgia,"Times New Roman",serif}
section{max-width:760px;margin:48px auto}
h1{margin-bottom:20px}
.shelff{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.card{
    width:300px;
    background:#fff;
    border:1px solid #e0dbd5;
    border-radius:8px;
    padding:30px;
}
.card h2{margin-bottom:10px;text-align:center}
.card p{margin-bottom:20px;color:#555;text-align:center}
.btn{
    display:inline-block;
    background:#222;
    color:#fff;
    padding:10px 18px;
    border-radius:5px;
    text-decoration:none;
}
.card .btn{
    display:block;
    width:fit-content;
    margin:0 auto;
}
label{
    display:block;
    margin-bottom:8px;
}
textarea{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    resize:vertical;
    font:inherit;
}
button{
    background:#222;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:5px;
    cursor:pointer;
    font:inherit;
}
</style>
</head>

<body>

<section>

<h1>Welcome!</h1>

<div class="shelff">

<div class="card">
<h2>My Reading Space</h2>
<p>Read your owned books.</p>
<a class="btn" href="https://inyangpatrick-ak22-052.onrender.com" target="_blank">Read</a>
</div>

<div class="card">
<h2>P3KBooks</h2>
<p>Buy books.</p>
<a class="btn" href="https://book-retail-page.onrender.com">Buy</a>
</div>

<div class="card">
<h2>Contact us</h2>

<form action="https://formspree.io/f/mwvgkpag" method="POST">

<label for="owner-message">Comments, Instructions or Requests</label>

<textarea
id="owner-message"
name="message"
rows="5"
placeholder="Specify your specific book editions, instructions, or inquiries here..."
required></textarea>

<button type="submit">Submit</button>

</form>
</div>

</div>

</section>

</body>
</html>
